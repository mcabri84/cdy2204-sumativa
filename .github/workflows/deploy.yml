name: Build and Deploy CDY2204

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar proyecto
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cdy2204-sumativa:latest .

      - name: Publicar imagen Docker
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cdy2204-sumativa:latest

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cdy2204-sumativa:latest

            docker stop cdy2204-app || true
            docker rm cdy2204-app || true

            docker run -d \
              --name cdy2204-app \
              --network cdy2204-net \
              -p 8080:8080 \
              -v /mnt/efs/guias:/mnt/efs/guias \
              -e DB_HOST=cdy2204-postgres \
              -e DB_PORT=5432 \
              -e DB_NAME=cdy2204db \
              -e DB_USER=cdy2204user \
              -e DB_PASSWORD=Cdy2204Pass2026 \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
              -e EFS_PATH=/mnt/efs/guias \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/cdy2204-sumativa:latest

            docker ps
